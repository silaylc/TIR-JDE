[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tir_jde"
version = "0.0.1"
description = "Degradation-Adaptive Small Target Detection and Joint Identity Embedding for Multi-Object Tracking in Thermal Infrared UAV Imagery"
authors = [
  { name = "silaylc" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.10"


[tool.ruff]
line-length = 99
src = ["tir_jde"]
include = ["pyproject.toml", "tir_jde/**/*.py"]
extend-exclude = [".pixi"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["tir_jde"]
force-sort-within-sections = true

