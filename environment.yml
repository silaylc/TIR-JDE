name: tir-jde
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - typer
  - loguru
  - tqdm
  - ipython
  - jupyterlab
  - matplotlib
  - notebook
  - numpy
  - pandas
  - scikit-learn
  - ruff
  - pytest
  # TIR-JDE'ye özgü bağımlılıklar
  - scipy
  - opencv
  - pyyaml
  - pip:
    - python-dotenv
    - mkdocs
    # TrackEval (HOTA, IDF1, MOTA): değerlendirme aşamasında
    - git+https://github.com/JonathonLuiten/TrackEval.git
    # PyTorch ve Ultralytics dedektör aşamasında eklenecek
    - -e .
