# BSB (Beyond Strong Baseline) — sekans bazlı 102/98 bölünme.
data:
  name: bsb
  # Ham veri: her sekans için bir video (veya kare klasörü) ve MOTChallenge etiketi.
  # Kaynak: Zenodo 15853476, Train.zip (3.8 GB) -> TrainImages/, TrainLabels/, TrainVideos/
  raw_root: ${BSB_ROOT:-./data/raw/bsb}
  frames_dir: TrainImages         # hazır kareler: <raw_root>/TrainImages/<seq>/00000.jpg ... (sıralı)
  videos_dir: TrainVideos         # frames_dir: null verilirse kareler videodan çıkarılır
  video_ext: .mp4
  labels_dir: TrainLabels         # <raw_root>/<labels_dir>/<seq>.txt (kare numarası 1'den başlar)
  # Sekans listeleri (Git'te, değişmez)
  splits:
    train: data/splits/bsb_train.txt
    val: data/splits/val.txt      # eğitim sekanslarından ayrılan doğrulama grubu
  image_ext: .jpg
  reid:
    # Strong Baseline makalesindeki gibi: her sekansın ilk 1/10'u (1.0 = hepsi)
    first_fraction: 0.1
    min_size: 2                   # bu pikselden küçük kırpıntılar atlanır
