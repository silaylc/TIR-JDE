model:
  name: strong_baseline
  adapter: strong_baseline
  repo: https://github.com/silaylc/Yolov12_BoT-SORT_Re-ID
  commit: 4ecdd2431818            # yazarın commit'i: 071fe76 (+ eksik resim, FastReID zero_grad uyumu)
  python: ${SB_PYTHON:-python}    # Strong Baseline ortamının python'u (Python 3.11, torch 2.2.2)
  # FastReID her ReID değerlendirmesinde Cython modülünü yeniden derleyip bu dosyaları yeniden üretir;
  # kod değişikliği sayılmaz, çalıştırmadan önce repodaki haline döndürülür.
  generated_files:
    - BoT-SORT/fast_reid/fastreid/evaluation/rank_cylib/*.c
  detector:
    arch: yolov12n                # sıfırdan eğitim: ultralytics/cfg/models/v12/<arch>.yaml
    init: scratch                 # scratch | coco | sot | <.pt yolu>
    pretrained:                   # init anahtarı -> indirilecek ağırlık (bir kez indirilir, SHA-256 denetlenir)
      # fork'taki mimari YOLOv12-turbo (ultralytics/cfg/models/v12/yolov12.yaml); COCO ağırlığı da turbo sürümü
      coco:
        url: https://github.com/sunsmarterjie/yolov12/releases/download/turbo/{arch}.pt
      # Strong Baseline'ın SOT ağırlığı: YOLOv12-L, 640, Track 1/2 SOT verisi (yazar reposu, commit 071fe76).
      # Eğitim kaydındaki başlangıç: yolov12l.pt (makale "sıfırdan" diyor); raporda "SB'nin SOT ağırlığı".
      # MOT_yolov12n.pt ve ReID model_0016.pth kullanılmaz (BSB val/test sekanslarının karelerini görmüşler).
      sot:
        url: https://raw.githubusercontent.com/wish44165/YOLOv12-BoT-SORT-ReID/071fe7611eef373d503e87236c6a42ea613e6d0f/BoT-SORT/yolov12/weights/v1/SOT_yolov12l.pt
        sha256: e1b99a2a74ee20b6cd76c85b1e507f658ab1900a3d328739a4ac0849726ea61e
        arch: yolov12l
    epochs: 100
    batch: 64
    imgsz: 640
    workers: 8
  reid:
    enabled: true
    config: logs/sbs_S50/config.yaml
    weights: null                 # null = bu çalıştırmada eğitilen ReID kullanılır
    max_epoch: null               # null = yazarın config'indeki epoch sayısı; duman testinde 1
    extra: {}                     # ek Ultralytics argümanları; yalnızca duman testi için
                                  # (ör. model.detector.extra.fraction=0.1 model.detector.extra.conf=0.1)
  tracker:
    imgsz: 1600                   # yazarın run_track3 ayarı
    conf: null                    # null = betiğin varsayılanı (--conf-thres 0.09, yazar tarifi)
    track_buffer: 60
    agnostic_nms: true
