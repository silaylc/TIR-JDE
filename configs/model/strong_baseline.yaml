model:
  name: strong_baseline
  adapter: strong_baseline
  repo: https://github.com/silaylc/Yolov12_BoT-SORT_Re-ID
  commit: c7c9ab0a9603            # yazarın commit'i: 071fe76
  python: ${SB_PYTHON:-python}    # Strong Baseline ortamının python'u (Python 3.11, torch 2.2.2)
  detector:
    arch: yolov12n                # sıfırdan eğitim: ultralytics/cfg/models/v12/<arch>.yaml
    init: scratch                 # scratch | <.pt yolu> (örn. COCO yolov12n.pt)
    epochs: 100
    batch: 64
    imgsz: 640
    workers: 8
  reid:
    enabled: true
    config: logs/sbs_S50/config.yaml
    weights: null                 # null = bu çalıştırmada eğitilen ReID kullanılır
    max_epoch: null               # null = yazarın config'indeki epoch sayısı; duman testinde 1
  tracker:
    img_size: 1600
    track_buffer: 60
    agnostic_nms: true
