model:
  name: dist_tracker
  adapter: dist_tracker
  repo: https://github.com/silaylc/YOLOv12-Dist-Tracker
  commit: 52b1729e2426            # yazarın commit'i: 396c359
  python: ${DIST_PYTHON:-python}  # Dist-Tracker ortamının python'u (Python 3.8, torch 2.4.1)
  detector:
    cfg: ./cfg/models/12/yolo12-UAV.yaml
    init: scratch                 # scratch | coco | <.pt yolu>
    pretrained:
      coco:
        url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo12n.pt  # Ultralytics YOLO12n
    epochs: 50                    # yazarın train.py değerleri
    batch: 16
    imgsz: 640
    extra: {}                     # ek Ultralytics argümanları; yalnızca duman testi için
                                  # (ör. model.detector.extra.fraction=0.1 model.detector.extra.conf=0.1)
  tracker:
    cfg: botsort.yaml             # yazarın cfg/trackers/botsort.yaml dosyası
    imgsz: 1280                   # yazarın track.py değerleri
    conf: 0.0
    first_frame_gt: false         # BSB protokolü (1. kare verilen kutularla). Colab'da first_frame_match = 1.0
                                  # doğrulanınca true yapılacak; o zamana kadar komut satırından açılır.
