# Ayarlar her deneyde ortak. Deney dosyaları bunları ezebilir.
seed: 0

paths:
  # Çalıştırma klasörü: ağırlıklar, takip çıktıları, grafikler.
  # Colab'da Drive'a yönlendirin, örn. TIRJDE_WORK=/content/drive/MyDrive/tir-jde-work
  work_dir: ${TIRJDE_WORK:-./work}
  # Preprocess çıktıları (on binlerce küçük dosya). Boşsa <work_dir>/data kullanılır.
  # Colab'da Drive yerine yerel diske verin: TIRJDE_DATA=/content/work-data
  data_dir: ${TIRJDE_DATA:-}
  # Baseline depolarının ve Python ortamlarının bulunduğu yer
  baselines_dir: ${TIRJDE_BASELINES:-./work/baselines}

tracking:
  # MLflow deney adı. Uzak sunucu MLFLOW_TRACKING_URI ortam değişkeniyle verilir;
  # verilmezse <work_dir>/mlflow.db (SQLite) altında yerel kayıt tutulur.
  experiment: tir-jde-baselines
  # DagsHub: DAGSHUB_USER ve DAGSHUB_TOKEN ortam değişkenleri tanımlıysa kayıtlar
  # https://dagshub.com/<owner>/<repo>.mlflow adresine gider.
  dagshub:
    owner: slaaylc                # DagsHub kullanıcı adı (GitHub adından farklı)
    repo: TIR-JDE

eval:
  metrics: [HOTA, CLEAR, Identity]
