name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml numpy scipy pandas matplotlib opencv-python-headless \
            loguru python-dotenv tqdm typer mlflow \
            "git+https://github.com/JonathonLuiten/TrackEval.git"
          pip install -e . --no-deps
      - name: Run tests
        run: pytest -v
